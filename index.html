<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; connect-src 'none'; img-src 'none'; font-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="robots" content="index,follow">
  <meta name="theme-color" content="#f7f5ef">
  <meta name="description" content="日々のちょっとした作業に使える、シンプルなWebツールをまとめています。">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Tools Personal">
  <meta property="og:title" content="Tools Personal｜シンプルなWebツール集">
  <meta property="og:description" content="日々のちょっとした作業に使える、シンプルなWebツールをまとめています。">
  <meta property="og:url" content="https://teruluce.github.io/duck-address-generator/">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Tools Personal｜シンプルなWebツール集">
  <meta name="twitter:description" content="日々のちょっとした作業に使える、シンプルなWebツールをまとめています。">
  <link rel="canonical" href="https://teruluce.github.io/duck-address-generator/">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <title>Tools Personal｜シンプルなWebツール集</title>
  <style>
    :root {
      --bg: #f7f5ef; --paper: #fffefa; --ink: #333b33; --muted: #73796f;
      --green: #879982; --green-dark: #526b54; --line: #e5e4da;
      --soft: #e8ede3; --radius: 22px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 36px 18px; color: var(--ink);
      background: radial-gradient(circle at 8% 8%, #e4e9dc 0, #e4e9dc 95px, transparent 96px),
                  radial-gradient(circle at 94% 80%, #eee8dc 0, #eee8dc 125px, transparent 126px), var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      line-height: 1.7;
    }
    a { color: inherit; text-decoration: none; }
    a:focus-visible { outline: 3px solid rgba(82,107,84,.45); outline-offset: 3px; }
    .page { width: 100%; max-width: 680px; margin: 0 auto; }
    .topline { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 30px; color: var(--muted); font-size: 12px; letter-spacing: .12em; }
    .dot { display: inline-block; width: 8px; height: 8px; margin-right: 8px; border-radius: 50%; background: var(--green); }
    header { position: relative; overflow: hidden; padding: 34px 30px 38px; border: 1px solid rgba(120,135,112,.15); border-radius: 28px; background: rgba(255,254,250,.78); }
    .eyebrow { margin: 0 0 8px; color: var(--green-dark); font-size: 12px; letter-spacing: .15em; text-transform: uppercase; }
    h1 { position: relative; z-index: 1; margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: clamp(34px,7vw,48px); font-weight: 400; letter-spacing: -.04em; line-height: 1.15; }
    .intro { position: relative; z-index: 1; max-width: 420px; margin: 18px 0 0; color: var(--muted); font-size: 14px; }
    .decoration { position: absolute; top: -35px; right: -25px; width: 180px; height: 180px; border: 1px solid rgba(135,153,130,.45); border-radius: 50%; }
    .decoration::before, .decoration::after { position: absolute; content: ""; border: 1px solid rgba(135,153,130,.35); border-radius: 50%; }
    .decoration::before { inset: 22px; }
    .decoration::after { inset: 44px; background: rgba(232,237,227,.5); }
    main { margin-top: 20px; padding: 28px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--paper); box-shadow: 0 12px 35px rgba(56,62,48,.04); }
    .section-title { margin: 0 0 6px; font-family: Georgia, "Times New Roman", serif; font-size: 24px; font-weight: 400; }
    .section-description { margin: 0 0 22px; color: var(--muted); font-size: 13px; }
    .tools { margin: 0; padding: 0; list-style: none; border-top: 1px solid var(--line); }
    .tools li { border-bottom: 1px solid var(--line); }
    .tool { display: flex; align-items: center; gap: 16px; min-height: 84px; padding: 14px 8px; border-radius: 12px; transition: background-color .2s ease; }
    .tool:hover { background: var(--soft); }
    .badge { flex: none; display: grid; place-items: center; width: 44px; height: 44px; border: 1px solid rgba(135,153,130,.5); border-radius: 50%; background: var(--soft); color: var(--green-dark); font-family: Georgia, "Times New Roman", serif; font-size: 18px; }
    .body { flex: 1; min-width: 0; }
    .name { display: block; font-family: Georgia, "Times New Roman", serif; font-size: 20px; line-height: 1.3; }
    .note { display: block; margin-top: 2px; color: var(--muted); font-size: 12px; }
    .arrow { flex: none; color: var(--green-dark); font-size: 16px; }
    footer { padding: 25px 8px 0; color: var(--muted); font-size: 11px; text-align: center; }
    @media (max-width: 480px) {
      body { padding: 22px 13px; }
      header { padding: 28px 22px 30px; }
      main { padding: 22px 18px; }
      .decoration { top: -50px; right: -70px; }
      .topline { font-size: 10px; }
    }
    @media (prefers-reduced-motion: reduce) { .tool { transition: none; } }
  </style>
</head>
<body>
  <div class="page">
    <div class="topline">
      <span><span class="dot"></span>Personal tools</span>
      <span>Simple &amp; private</span>
    </div>
    <header>
      <div class="decoration" aria-hidden="true"></div>
      <p class="eyebrow">A little collection</p>
      <h1>Tools<br>Personal.</h1>
      <p class="intro">日々のちょっとした作業に使える、小さなWebツールをまとめています。使いたいものを選んでください。</p>
    </header>
    <main>
      <h2 class="section-title">Choose a tool</h2>
      <p class="section-description">シンプルで使いやすく、入力内容をできるだけ大切に扱うツールを目指しています。</p>
      <ul class="tools">
        <li>
          <a class="tool" href="./duckmail/">
            <span class="badge" aria-hidden="true">D</span>
            <span class="body"><span class="name">Duckアドレス生成ツール</span><span class="note">自分のDuckアドレスからメールを送るための宛先を作成</span></span>
            <span class="arrow" aria-hidden="true">→</span>
          </a>
        </li>
      </ul>
    </main>
    <footer>Tools Personal · A simple collection of useful tools</footer>
  </div>
</body>
</html>
